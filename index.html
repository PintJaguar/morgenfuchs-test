<!doctype html>
<html lang="de">
<head>
  <meta name="robots" content="noindex">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F2EDE3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Morgenfuchs</title>
  <style>
    :root { --paper: #F2EDE3; --ink: #C8664A; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #F2EDE3; } } /* the page is printed paper in both themes */
    :root[data-theme="dark"] { --paper: #F2EDE3; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    #stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    canvas { display: block; }
    /* Abdunkeln während der Wartezeit (dim-while-waiting D2): deckt das ganze Fenster (auch Letterbox, Safe-Area), fängt keine Berührung. Über #stage (inkl. Eltern-Ecke), unter Eltern-Ebene und Einstell-Feld (z-index 20). Kein transition: die Stufen kommen aus dem Takt (1/12 s). */
    #dim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 10; }
    .tile { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    /* Putz-Szene (brushing-scene D3): über Szene und Kacheln, unter der Eltern-Ecke (z 5); fängt Tipps ab */
    .brush-session { position: absolute; left: 0; top: 0; z-index: 4; touch-action: none; }
    /* Abbrechen-Kreuz der Putz-Folge (tile-time-and-brush-option D7): neben der Eltern-Ecke, über der Putz-Szene (z 4), unter dem Abdunkeln */
    .brush-cancel { position: fixed; top: env(safe-area-inset-top, 0px); right: calc(64px + env(safe-area-inset-right, 0px)); width: 64px; height: 64px; z-index: 6; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .brush-cancel[hidden] { display: none; }
    .brush-cancel-cross { position: absolute; left: 10px; top: 10px; pointer-events: none; }
    /* Pause der Putz-Szene (Marc 15.10.): ein Tippen aufs Bild hält an. Tipp-Fläche über der Putz-Szene (z 4), in z 5 vor der
       Eltern-Ecke im DOM (die Ecke liegt also darüber), unter dem Kreuz (z 6). Das Zeichen pulsiert leicht, in 12 Stufen je s. */
    .brush-pause { position: absolute; inset: 0; z-index: 5; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .brush-pause[hidden] { display: none; }
    .brush-pause-sign { position: absolute; width: 128px; height: 128px; pointer-events: none; }
    .brush-pause-sign canvas { position: absolute; left: 0; top: 0; }
    .brush-pause-ink { animation: brush-pause-pulse 2.5s infinite steps(30, end); }
    .brush-pause-sign[hidden] { display: none; }
    @keyframes brush-pause-pulse { 0% { opacity: 1; } 50% { opacity: 0.45; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .brush-pause-ink { animation: none; } }
    /* Eltern-Zone (specs/parent-zone): unsichtbare Ecke. Transparent, sonst verdeckt sie im Hochformat den Bildrahmen. */
    .parent-zone { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); width: 64px; height: 64px; background: transparent; z-index: 5; touch-action: none; -webkit-tap-highlight-color: transparent; }
    /* Entdeck-Hinweis und Halte-Ring (parent-zone-hint D2): gedruckter Fleck, nur die Deckkraft ändert sich, in Stufen (≤ 12 je s) */
    .pz-hint { position: absolute; left: 8px; top: 8px; width: 48px; height: 48px; pointer-events: none; opacity: 0; }
    .pz-hint.pz-pulse { animation: pz-pulse 3s infinite steps(11, end); }
    .pz-hint.pz-still { opacity: 0.2; }
    .pz-hint.pz-holding { opacity: 0.9; animation: none; }
    .pz-hint.pz-off { opacity: 0; animation: none; }
    /* Bei abgedunkeltem Bild (Abdunkeln): die Ecke liegt über dem Overlay und leuchtet hell, invertiert zum Dunkel, und pulsiert (Marc 10.10.) */
    .pz-glow { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); width: 64px; height: 64px; z-index: 11; pointer-events: none; }
    .pz-glow .pz-hint { left: 8px; top: 8px; }
    .pz-hint.pz-darkmode { filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(255, 255, 255, 0.9)); }
    .pz-hint.pz-darkmode.pz-pulse { animation: pz-pulse-dark 3s infinite steps(11, end); }
    .pz-hint.pz-darkmode.pz-still { opacity: 0.6; }
    @keyframes pz-pulse-dark { 0% { opacity: 0.45; } 30% { opacity: 1; } 70% { opacity: 0.45; } 100% { opacity: 0.45; } }
    @keyframes pz-pulse { 0% { opacity: 0; } 30% { opacity: 0.35; } 70% { opacity: 0; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .pz-hint.pz-pulse { animation: none; opacity: 0.2; } .pz-hint.pz-darkmode.pz-pulse { animation: none; opacity: 0.6; } }
    .parent-layer { position: fixed; inset: 0; z-index: 20; overflow-y: auto; box-sizing: border-box; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--paper); color: var(--ink); font: 16px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: auto; user-select: auto; }
    .parent-layer[hidden] { display: none; }
    .parent-layer h2 { font-size: 15px; font-weight: 600; margin: 18px 0 10px; }
    .parent-layer h2:first-child { margin-top: 0; }
    .parent-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .parent-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; min-height: 64px; padding: 8px; border: 2px solid transparent; border-radius: 12px; background: transparent; color: inherit; font: 13px/1.2 -apple-system, system-ui, sans-serif; }
    .parent-btn canvas { display: block; border-radius: 8px; }
    .parent-btn[aria-pressed="true"] { border-color: var(--ink); }
    .parent-check { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 20px; text-align: center; opacity: 0; }
    .parent-btn[aria-pressed="true"] .parent-check { opacity: 1; }
    .parent-action { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; min-height: 64px; margin: 6px 10px 6px 0; padding: 0 18px; border: 2px solid var(--ink); border-radius: 12px; background: transparent; color: inherit; font: 15px/1.2 -apple-system, system-ui, sans-serif; }
    .parent-wait { display: flex; align-items: center; }
    .parent-wait-step { min-width: 64px; margin: 6px 0; padding: 0; font-size: 28px; }
    .parent-wait-step:disabled { opacity: 0.3; }
    .parent-brush { flex-wrap: wrap; }
    .parent-brush-anim { margin-left: 12px; margin-right: 0; }
    .parent-wait-value { display: inline-block; min-width: 124px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
    /* Ton-Schalter: an = gefüllt, aus = leer + durchgestrichen (auch ohne Farbe erkennbar) */
    .parent-sound-row { display: flex; }
    .parent-sound, .parent-dim, .parent-brush-anim { min-width: 120px; }
    .parent-sound[aria-pressed="true"], .parent-dim[aria-pressed="true"], .parent-brush-anim[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .parent-sound[aria-pressed="false"], .parent-dim[aria-pressed="false"], .parent-brush-anim[aria-pressed="false"] { text-decoration: line-through; }
    /* beide Zurücksetzen-Schalter in einer Zeile, Text darf umbrechen (Handy hoch: 375 px, alles ohne Scrollen) */
    .parent-reset-row { display: flex; gap: 8px; }
    .parent-reset-row .parent-action { flex: 1 1 0; min-width: 0; margin: 6px 0; padding: 0 8px; text-align: center; }
    .parent-action--confirm { background: var(--ink); color: var(--paper); }
    .parent-done { display: block; position: sticky; bottom: 0; width: 100%; min-height: 64px; margin-top: 22px; border: 2px solid var(--ink); border-radius: 12px; background: var(--ink); color: var(--paper); font: 16px/1.2 -apple-system, system-ui, sans-serif; }
    /* Wo eine Seite scrollt, verschwindet der Inhalt sauber hinter einem Papierstreifen um den klebenden Knopf, statt halb
       neben und unter ihm hervorzuschauen (Rundgang 15.10.: Handy quer, Einstieg Seite 2) */
    .parent-layer > .parent-done { box-shadow: 0 0 0 10px var(--paper); }
    .parent-build { margin: 8px 0 0; text-align: center; font: 12px/1.2 -apple-system, system-ui, sans-serif; color: var(--ink); opacity: 0.6; }
    /* Quer (iPad, auch mit Safari-Leisten ~1180x740): zwei Spalten, alles bis "Fertig" ohne Scrollen (fox-arms-feedback D5). */
    /* Einstell-Feld der Kachel (specs/tile-wait-times): Eltern-Stil, Papier halbtransparent über der Szene. */
    .tile-wait-layer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 16px; background: rgba(242, 237, 227, 0.85); background: color-mix(in srgb, var(--paper) 85%, transparent); color: var(--ink); font: 16px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: auto; user-select: auto; }
    .tile-wait-card { display: flex; flex-direction: column; align-items: center; gap: 4px; box-sizing: border-box; width: min(100%, 420px); max-height: 100%; overflow-y: auto; padding: 18px 16px; border: 2px solid var(--ink); border-radius: 16px; background: var(--paper); }
    .tile-wait-card h2 { font-size: 15px; font-weight: 600; margin: 10px 0 6px; text-align: center; }
    .tile-wait-icon { display: block; border-radius: 8px; }
    .tile-wait-value { min-width: 150px; }
    .tile-wait-note { display: block; font-size: 14px; opacity: 0.75; }
    .tile-wait-same { margin: 6px 0; }
    .tile-wait-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 0 10px; }
    .tile-wait-actions .parent-action { margin: 6px 0; }
    .tile-wait-done { margin-top: 14px; }
    /* poc-readiness: Unterseiten (Schritte und Zeiten, Unsere Morgen) über der Hauptseite; sie dürfen scrollen */
    .parent-sub { z-index: 21; }
    .parent-sub .parent-done { margin-top: 16px; }
    .parent-more-btn { padding: 0 14px; }
    .parent-steps-btn { margin-left: 0; }
    .parent-reset-row .parent-more-btn { flex: 0 0 auto; padding: 0 14px; }
    .parent-more-entry { display: flex; width: 100%; max-width: 420px; }
    .step-rows { display: flex; flex-direction: column; gap: 8px; max-width: 720px; }
    .step-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 4px 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
    .step-icon { display: block; border-radius: 8px; flex: none; }
    .step-name { min-width: 124px; font-size: 16px; }
    .step-toggle { min-width: 76px; margin: 0; }
    .step-toggle[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .step-toggle[aria-pressed="false"] { text-decoration: line-through; }
    .step-toggle--locked { opacity: 0.55; }
    .step-row--off .step-icon, .step-row--off .step-name { opacity: 0.4; }
    .step-time-row { display: flex; align-items: center; margin-left: auto; }
    .step-time-row .parent-wait-step { margin: 0; }
    .step-time { min-width: 104px; font-size: 17px; }
    /* Umsortieren (Marc 15.10.): Griff mit Punkten, Nummer der Kachel und Icon; die gezogene Zeile liegt obenauf */
    .step-row { background: var(--paper); }
    .step-handle { display: flex; align-items: center; gap: 6px; min-height: 64px; padding-right: 4px; touch-action: none; cursor: grab; flex: none; }
    .step-handle--fixed { cursor: default; }
    .step-grip { width: 12px; height: 22px; opacity: 0.55; background: radial-gradient(circle, var(--ink) 1.6px, transparent 1.9px) 0 0 / 6px 6px; }
    .step-handle--fixed .step-grip { visibility: hidden; }
    .step-nr { min-width: 14px; font-size: 16px; font-weight: 600; text-align: center; }
    .step-row--drag { position: relative; z-index: 2; box-shadow: 0 4px 0 color-mix(in srgb, var(--ink) 35%, transparent); }
    .step-row--all { border-bottom-width: 2px; }
    .step-row--all .step-name { font-weight: 600; }
    .parent-steps-btn { padding: 0 18px; }
    .onboarding { z-index: 22; }
    .onboarding-text { max-width: 640px; }
    .onboarding h2.onboarding-title { font-size: 22px; margin: 0 0 6px; }
    .onboarding-text p { margin: 0 0 10px; font-size: 17px; line-height: 1.45; }
    .onboarding-text ul { margin: 0 0 12px; padding-left: 22px; }
    .onboarding-text li { margin: 0 0 8px; font-size: 16px; line-height: 1.45; }
    .onboarding-text h3 { margin: 16px 0 6px; font-size: 16px; font-weight: 600; }
    .onboarding-note { margin: 0 0 12px; font-size: 15px; opacity: 0.85; max-width: 560px; }
    .log-list { list-style: none; margin: 0 0 12px; padding: 0; max-width: 720px; }
    .log-day { padding: 8px 0; border-bottom: 1px solid color-mix(in srgb, var(--ink) 25%, transparent); }
    .log-head { font-size: 16px; font-variant-numeric: tabular-nums; }
    .log-steps { font-size: 14px; opacity: 0.8; }
    .log-text { display: block; width: 100%; max-width: 720px; min-height: 160px; margin-top: 8px; font: 13px/1.4 ui-monospace, monospace; color: inherit; background: transparent; border: 2px solid var(--ink); border-radius: 12px; }
    .parent-cols { display: block; }
    @media (max-width: 479px) {
      .parent-layer { padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
      .parent-layer h2 { margin: 10px 0 6px; }
      .parent-grid { gap: 8px; }
      .parent-btn { padding: 6px 3px; }
      .parent-action { margin: 4px 10px 4px 0; }
      /* 375 px breit: alles bis "Fertig" ohne Scrollen (Marc 11.10.): Farbnamen brechen um statt die Felder auf zwei Zeilen zu verteilen,
         "Animation" steht in der Zeile der Putzzeit, "Ton" und "Abdunkeln" nebeneinander */
      .parent-grid .parent-btn span:not(.parent-check) { max-width: 68px; text-align: center; overflow-wrap: anywhere; }
      /* "1 Min 30 s" lief in das + (Rundgang 15.10.): beide Werte gleich breit, − und + ohne Außenabstand */
      .parent-wait-value:not(.step-time) { min-width: 96px; font-size: 18px; }
      .parent-col .parent-wait .parent-wait-step { margin: 4px 0; }
      .parent-steps-btn { margin-left: 0; padding: 0 14px; }
      /* Schritte und Zeiten hoch am Handy: eine Zeile je Schritt, Knöpfe 44 px (Marc 15.10., Ausnahme zu Regel 7) */
      .step-row { flex-wrap: nowrap; gap: 4px; padding: 2px 0; }
      .step-handle { gap: 4px; min-height: 48px; padding-right: 0; }
      .step-nr { min-width: 12px; font-size: 14px; }
      .step-name { flex: 1 1 auto; min-width: 0; font-size: 13px; overflow-wrap: anywhere; hyphens: auto; }
      .step-toggle { min-width: 44px; min-height: 44px; margin: 0; padding: 0 4px; font-size: 13px; }
      .step-time-row .parent-wait-step { min-width: 44px; min-height: 44px; font-size: 22px; }
      .step-time { min-width: 48px; font-size: 15px; }
      .parent-brush-anim { min-width: 0; margin: 4px 0 4px 6px; padding: 0 10px; }
      .parent-col > .parent-sound-row { display: inline-flex; }
      .parent-done { margin-top: 10px; }
      .parent-build { margin-top: 4px; }
    }
    .parent-col > h2:first-child { margin-top: 0; }
    @media (orientation: landscape) and ((min-width: 1024px) or (max-height: 499px)) {
      .parent-layer { padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
      .parent-cols { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "a b" "a c"; column-gap: 32px; align-items: start; }
      .parent-col:nth-child(1) { grid-area: a; }
      .parent-col:nth-child(2) { grid-area: b; }
      .parent-col-c { grid-area: c; }
      .parent-layer h2 { margin: 10px 0 6px; }
      .parent-grid { gap: 8px; }
      .parent-action { margin: 4px 10px 4px 0; }
      .parent-done { margin-top: 12px; }
      .parent-build { margin-top: 4px; }
    }
    .parent-col-c > h2:first-child { margin-top: 18px; }
    @media (max-width: 479px), (orientation: landscape) and ((min-width: 1024px) or (max-height: 499px)) {
      .parent-col-c > h2:first-child { margin-top: 10px; }
    }
    /* Am PC nicht über die ganze Breite ziehen (Rundgang 15.10.) */
    @media (min-width: 1300px) {
      .parent-layer:not(.parent-sub) > * { max-width: 1160px; margin-left: auto; margin-right: auto; }
    }
    /* Handy quer (Rundgang 15.10.): Hauptmenü in drei Spalten, "Fertig" unter der dritten statt als klebende Leiste über Ton
       und Zurücksetzen (Unterseiten und Einstieg bleiben einspaltig); das Feld der Kachel nebeneinander statt untereinander */
    @media (orientation: landscape) and (max-height: 499px) {
      .parent-layer:not(.parent-sub):not([hidden]) { display: grid; grid-template-columns: 1fr 1fr 1fr; grid-template-rows: auto auto 1fr; column-gap: 20px; align-content: start; }
      .parent-cols { display: contents; }
      .parent-col:nth-child(1) { grid-area: 1 / 1 / 4 / 2; }
      .parent-col:nth-child(2) { grid-area: 1 / 2 / 4 / 3; }
      .parent-col-c { grid-area: 1 / 3 / 2 / 4; }
      .parent-col-c > h2:first-child { margin-top: 0; }
      .parent-col-c > .parent-sound-row { display: inline-flex; }
      .parent-layer:not(.parent-sub) > .parent-done { grid-area: 2 / 3 / 3 / 4; position: static; margin-top: 8px; }
      .parent-layer:not(.parent-sub) > .parent-build { grid-area: 3 / 3 / 4 / 4; }
      .parent-col .parent-wait-value { min-width: 88px; }
      .parent-col .parent-wait .parent-wait-step { margin: 4px 0; }
      .parent-steps-btn { padding: 0 10px; font-size: 14px; }
      .parent-btn { padding: 6px 3px; }
      .parent-grid { gap: 6px; }
      .parent-reset-row .parent-action { font-size: 14px; }
      .tile-wait-card { display: grid; grid-template-columns: auto 1fr; grid-template-areas: "icon head" "icon row" "icon same" "done done"; justify-items: center; align-items: center; column-gap: 16px; width: min(100%, 560px); padding: 12px 16px; }
      .tile-wait-icon { grid-area: icon; }
      .tile-wait-card h2 { grid-area: head; margin: 0; }
      .tile-wait-card .parent-wait { grid-area: row; }
      .tile-wait-actions { grid-area: same; }
      .tile-wait-done { grid-area: done; margin-top: 8px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/main-T6uGAorn.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/frame-Cu5OsLyV.js">

<body>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="dim" data-dim="1.00" aria-hidden="true"></div>
