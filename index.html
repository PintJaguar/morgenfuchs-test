<!doctype html>
<html lang="de">
<head>
  <meta name="robots" content="noindex">

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#F2EDE3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Morgenfuchs</title>
  <style>
    :root { --paper: #F2EDE3; --ink: #C8664A; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: #F2EDE3; } } /* the page is printed paper in both themes */
    :root[data-theme="dark"] { --paper: #F2EDE3; }
    html, body { margin: 0; height: 100%; background: var(--paper); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
    #stage { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    canvas { display: block; }
    .tile { position: absolute; background: transparent; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    .tile:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
    /* Eltern-Zone (specs/parent-zone): unsichtbare Ecke. Transparent, sonst verdeckt sie im Hochformat den Bildrahmen. */
    .parent-zone { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); width: 64px; height: 64px; background: transparent; z-index: 5; touch-action: none; -webkit-tap-highlight-color: transparent; }
    .parent-layer { position: fixed; inset: 0; z-index: 20; overflow-y: auto; box-sizing: border-box; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--paper); color: var(--ink); font: 16px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: auto; user-select: auto; }
    .parent-layer[hidden] { display: none; }
    .parent-layer h2 { font-size: 15px; font-weight: 600; margin: 18px 0 10px; }
    .parent-layer h2:first-child { margin-top: 0; }
    .parent-grid { display: flex; flex-wrap: wrap; gap: 12px; }
    .parent-btn { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 64px; min-height: 64px; padding: 8px; border: 2px solid transparent; border-radius: 12px; background: transparent; color: inherit; font: 13px/1.2 -apple-system, system-ui, sans-serif; }
    .parent-btn canvas { display: block; border-radius: 8px; }
    .parent-btn[aria-pressed="true"] { border-color: var(--ink); }
    .parent-check { position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 12px; line-height: 20px; text-align: center; opacity: 0; }
    .parent-btn[aria-pressed="true"] .parent-check { opacity: 1; }
    .parent-action { display: inline-flex; align-items: center; justify-content: center; min-width: 64px; min-height: 64px; margin: 6px 10px 6px 0; padding: 0 18px; border: 2px solid var(--ink); border-radius: 12px; background: transparent; color: inherit; font: 15px/1.2 -apple-system, system-ui, sans-serif; }
    .parent-wait { display: flex; align-items: center; }
    .parent-wait-step { min-width: 64px; margin: 6px 0; padding: 0; font-size: 28px; }
    .parent-wait-step:disabled { opacity: 0.3; }
    .parent-wait-value { display: inline-block; min-width: 124px; text-align: center; font-size: 20px; font-variant-numeric: tabular-nums; }
    /* Ton-Schalter: an = gefüllt, aus = leer + durchgestrichen (auch ohne Farbe erkennbar) */
    .parent-sound-row { display: flex; }
    .parent-sound { min-width: 120px; }
    .parent-sound[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
    .parent-sound[aria-pressed="false"] { text-decoration: line-through; }
    .parent-action--confirm { background: var(--ink); color: var(--paper); }
    .parent-confirm { display: flex; }
    .parent-confirm[hidden] { display: none; }
    .parent-confirm--wait { flex-wrap: wrap; }
    .parent-confirm-text { flex: 0 0 100%; margin: 6px 0 0; font-size: 15px; }
    .parent-done { display: block; position: sticky; bottom: 0; width: 100%; min-height: 64px; margin-top: 22px; border: 2px solid var(--ink); border-radius: 12px; background: var(--ink); color: var(--paper); font: 16px/1.2 -apple-system, system-ui, sans-serif; }
    .parent-build { margin: 8px 0 0; text-align: center; font: 12px/1.2 -apple-system, system-ui, sans-serif; color: var(--ink); opacity: 0.6; }
    /* Quer (iPad, auch mit Safari-Leisten ~1180x740): zwei Spalten, alles bis "Fertig" ohne Scrollen (fox-arms-feedback D5). */
    /* Einstell-Feld der Kachel (specs/tile-wait-times): Eltern-Stil, Papier halbtransparent über der Szene. */
    .tile-wait-layer { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; box-sizing: border-box; padding: 16px; background: rgba(242, 237, 227, 0.85); background: color-mix(in srgb, var(--paper) 85%, transparent); color: var(--ink); font: 16px/1.4 -apple-system, system-ui, sans-serif; -webkit-user-select: auto; user-select: auto; }
    .tile-wait-card { display: flex; flex-direction: column; align-items: center; gap: 4px; box-sizing: border-box; width: min(100%, 420px); max-height: 100%; overflow-y: auto; padding: 18px 16px; border: 2px solid var(--ink); border-radius: 16px; background: var(--paper); }
    .tile-wait-card h2 { font-size: 15px; font-weight: 600; margin: 10px 0 6px; text-align: center; }
    .tile-wait-icon { display: block; border-radius: 8px; }
    .tile-wait-value { min-width: 150px; }
    .tile-wait-note { display: block; font-size: 14px; opacity: 0.75; }
    .tile-wait-same { margin: 6px 0; }
    .tile-wait-done { margin-top: 14px; }
    .parent-cols { display: block; }
    .parent-col > h2:first-child { margin-top: 0; }
    @media (min-width: 1024px) and (orientation: landscape) {
      .parent-layer { padding: 12px 20px calc(12px + env(safe-area-inset-bottom, 0px)); }
      .parent-cols { display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px; align-items: start; }
      .parent-layer h2 { margin: 10px 0 6px; }
      .parent-grid { gap: 8px; }
      .parent-action { margin: 4px 10px 4px 0; }
      .parent-done { margin-top: 12px; }
      .parent-build { margin-top: 4px; }
    }
  </style>
  <script type="module" crossorigin src="./assets/main-CpEhzXtc.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/frame-CJX7qb0A.js">
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>
</body>
</html>
